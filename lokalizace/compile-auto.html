<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>spike compile</title>
<script type="module">import "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"; window.__mindarReady = true;</script>
</head>
<body>
<pre id="s">start</pre>
<script>
// Automatická kompilace markerů pro spike -> POST na lokální upload server (jen dev nástroj).
(async () => {
  for (let i = 0; i < 100 && !window.MINDAR; i++) await new Promise(r => setTimeout(r, 200));

  const s = document.getElementById('s');
  const log = (t) => { s.textContent += '\n' + t; };
  try {
    const order = ['markers/vm-s5.png', 'markers/vm-s7.png', 'markers/vm-floor.png', 'markers/vm-prokop.png', 'markers/T1.png', 'markers/T2.png', 'markers/T3.png', 'markers/T4.png', 'markers/T5.png', 'markers/T6.png'];
    const imgs = [];
    for (const src of order) {
      const img = new Image(); img.src = src;
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });
      imgs.push(img); log('loaded ' + src);
    }
    const c = new MINDAR.IMAGE.Compiler();
    await c.compileImageTargets(imgs, p => { s.textContent = 'compile ' + Math.round(p) + '%'; });
    const buf = await c.exportData();
    log('compiled ' + buf.byteLength + ' bytes');
    const r = await fetch('http://localhost:8645/targets-spike.mind', { method: 'POST', body: buf });
    log('upload: ' + await r.text());
    document.title = 'DONE';
  } catch (e) { log('ERROR ' + e.message); document.title = 'ERROR'; }
})();
</script>
</body>
</html>
