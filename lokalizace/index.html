<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CBM spike: vizuální lokalizace</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script type="module">import "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"; window.__mindarReady = true;</script>
<style>
:root { --green:#17371F; --yellow:#F2B10E; --cream:#F7F1E3; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,system-ui,sans-serif; background:#0d120e; color:#fff; overflow:hidden; width:100vw; height:100dvh; }

#start { position:fixed; inset:0; z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:linear-gradient(160deg,#0d120e,#17371F); padding:24px; text-align:center; }
#start h1 { color:var(--yellow); font-size:1.4rem; }
#start p { color:#9db39f; font-size:.85rem; max-width:340px; line-height:1.5; }
#start.hidden { display:none; }
.btn { padding:13px 30px; border:none; border-radius:999px; font-size:1rem; font-weight:700; background:var(--yellow); color:var(--green); cursor:pointer; }
.btn.sec { background:transparent; border:1.5px solid var(--yellow); color:var(--yellow); }
.btn:disabled { opacity:.5; }
#compileStatus { color:var(--yellow); font-size:.8rem; min-height:1.2em; }

#hud { position:fixed; top:0; left:0; right:0; z-index:120; padding:10px 14px; display:none; justify-content:space-between; align-items:center; background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent); }
#hud.visible { display:flex; }
#fixBadge { padding:4px 12px; border-radius:999px; font-size:.75rem; font-weight:700; background:rgba(255,255,255,.12); color:#bbb; }
#fixBadge.fresh { background:rgba(66,245,90,.25); color:#42f55a; }
#fixBadge.dr { background:rgba(242,177,14,.25); color:var(--yellow); }

#arrowWrap { position:fixed; top:18dvh; left:50%; transform:translateX(-50%); z-index:110; display:none; flex-direction:column; align-items:center; gap:4px; pointer-events:none; }
#arrowWrap.visible { display:flex; }
#arrow { width:84px; height:84px; transition:transform .18s linear; filter:drop-shadow(0 4px 12px rgba(0,0,0,.5)); }
#arrowLabel { background:rgba(23,55,31,.88); color:var(--yellow); font-weight:700; font-size:.85rem; padding:5px 14px; border-radius:999px; }

#minimapWrap { position:fixed; left:10px; bottom:calc(10px + env(safe-area-inset-bottom)); z-index:110; border-radius:14px; overflow:hidden; border:2px solid var(--green); background:var(--cream); box-shadow:0 8px 24px rgba(0,0,0,.45); }
#minimap { display:block; width:44vw; max-width:230px; aspect-ratio:1; }

#panel { position:fixed; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); z-index:110; width:46vw; max-width:250px; display:flex; flex-direction:column; gap:8px; }
.card { background:rgba(13,18,14,.88); border:1px solid rgba(242,177,14,.35); border-radius:12px; padding:10px 12px; font-size:.78rem; line-height:1.45; }
.card b { color:var(--yellow); }
.card .mono { font-family:ui-monospace,monospace; font-size:.72rem; color:#cfe0d1; white-space:pre-line; }
.row { display:flex; gap:6px; }
.row .btn { flex:1; padding:9px 6px; font-size:.78rem; }

#simPad { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom)); z-index:130; display:none; gap:6px; }
#simPad.visible { display:flex; }
#simPad .btn { padding:10px 14px; font-size:.9rem; background:rgba(242,177,14,.9); }

#log { position:fixed; top:52px; left:10px; right:10px; z-index:200; max-height:38dvh; overflow-y:auto; background:rgba(0,0,0,.92); border:1px solid #333; border-radius:10px; padding:10px; font-family:ui-monospace,monospace; font-size:.7rem; color:#8f8; display:none; }
#log.visible { display:block; }
#placeToast { position:fixed; top:56px; left:50%; transform:translateX(-50%); z-index:150; max-width:88vw; background:rgba(23,55,31,.94); color:#F7F1E3; border:1.5px solid var(--yellow); border-radius:14px; padding:10px 16px; font-size:.85rem; line-height:1.45; display:none; }
#placeToast.visible { display:block; }
#log textarea { width:100%; height:80px; background:#111; color:#8f8; border:1px solid #333; margin-top:6px; }
</style>
</head>
<body>

<div id="start">
  <h1>CBM spike: vizuální lokalizace</h1>
  <p>Technický důkaz: fix pozice z tištěných markerů (MindAR), rotující minimapa a šipka k další stanici nad daty stations.json. Pracovní nástroj, ne produkt.</p>
  <p id="compileStatus"></p>
  <button class="btn" id="btnAR">AR režim (kamera)</button>
  <button class="btn sec" id="btnSim">Simulace (bez kamery)</button>
  <button class="btn sec" id="btnRoom">Dataset: <span id="roomLabel">testbed byt</span></button>
  <button class="btn sec" id="btnMirror">Zrcadlit mapu (DXF flip)</button>
</div>

<div id="hud">
  <span style="font-size:.8rem;font-weight:700">CBM lokalizace</span>
  <span id="fixBadge">bez fixu</span>
</div>

<div id="arrowWrap">
  <svg id="arrow" viewBox="0 0 100 100"><polygon points="50,6 78,58 58,50 58,92 42,92 42,50 22,58" fill="#F2B10E" stroke="#17371F" stroke-width="4"/></svg>
  <span id="arrowLabel">—</span>
</div>

<div id="placeToast"></div>
<div id="minimapWrap"><canvas id="minimap" width="460" height="460"></canvas></div>

<div id="panel">
  <div class="card"><b id="targetName">Cíl: —</b><div class="mono" id="stats">pozice: —</div></div>
  <div class="row">
    <button class="btn" id="btnNext">Další stanice ▸</button>
    <button class="btn sec" id="btnMeasure">Log</button>
  </div>
</div>

<div id="simPad">
  <button class="btn" data-sim="fix1">Fix M1</button>
  <button class="btn" data-sim="fix2">Fix M2</button>
  <button class="btn" data-sim="walk">Krok</button>
  <button class="btn" data-sim="rot">Otoč 30°</button>
</div>

<div id="log">
  <div><b>Měřicí log</b> (tlačítko Log zaznamená aktuální fix; export dole)</div>
  <div id="logLines"></div>
  <textarea id="logExport" readonly></textarea>
</div>

<script src="app.js"></script>
</body>
</html>
